<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobert Sales OS</title><style>body{font:14px system-ui;background:#0b0b0b;color:#eee;margin:0}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#151515;border:1px solid #333;border-radius:12px;padding:18px;margin-top:16px}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{width:100%;background:#0e0e0e;color:#eee;border:1px solid #444;border-radius:7px;padding:10px;margin-top:6px}.field{margin-top:12px}.btn{background:#222;color:#fff;border:1px solid #444;border-radius:7px;padding:10px 14px;cursor:pointer}.primary{background:#dc2626;border-color:#dc2626}.drop{border:1px dashed #666;border-radius:10px;padding:20px;text-align:center}.review{display:none}.fact{padding:10px;border-left:3px solid #22c55e;background:#101010;margin:7px 0}.infer{border-left-color:#eab308}.unknown{border-left-color:#777}.item{border:1px solid #333;border-radius:8px;padding:11px;margin:7px 0}.muted{color:#999;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid #444;border-radius:99px;padding:3px 7px;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>BOBERT Sales OS</h1><div class="muted">Capture once. Preserve evidence. Let AI reason. Automate the repetitive work.</div><div class="grid"><section class="card"><h2>Capture</h2><div class="drop"><b>Drop what you're already working on.</b><p class="muted">Email · Apollo screenshot · URL · article · note · document</p><input id="file" type="file" onchange="stageFile(this)"></div><div class="field">Account<input id="account" placeholder="Austin Commercial"></div><div class="field">Contact<input id="contact" placeholder="Brian Andrews"></div><div class="field">Source URL<input id="url" placeholder="Paste URL if available"></div><div class="field">What happened / source<textarea id="text" rows="8" placeholder="Paste email or notes here..."></textarea></div><div class="actions"><button class="btn primary" onclick="analyze()">Analyze</button><button class="btn" onclick="clearForm()">Clear</button></div></section><section class="card review" id="review"><h2>Bobert Review</h2><div id="reviewBody"></div><div class="actions"><button class="btn primary" onclick="commit()">Commit</button><button class="btn" onclick="commit(true)">Evidence Only</button><button class="btn" onclick="clearReview()">Reject</button></div></section></div><section class="card"><h2>Recent Memory</h2><div id="memory"></div></section></main><script>const KEY='bobert_sales_os_v2';let db=JSON.parse(localStorage.getItem(KEY)||'{"accounts":[],"contacts":[],"evidence":[],"activities":[]}'),pending=null;const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random();const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function account(n){if(!n)return null;let a=db.accounts.find(x=>x.name.toLowerCase()===n.trim().toLowerCase());if(!a){a={id:id(),name:n.trim(),status:'Working',createdAt:new Date().toISOString()};db.accounts.unshift(a)}return a}function contact(n,a){if(!n)return null;let c=db.contacts.find(x=>x.name.toLowerCase()===n.trim().toLowerCase()&&x.accountId===a?.id);if(!c){c={id:id(),name:n.trim(),accountId:a?.id||null,confidence:'Needs verification'};db.contacts.unshift(c)}return c}function analyze(){const a=account(document.getElementById('account').value),c=contact(document.getElementById('contact').value,a),t=document.getElementById('text').value.trim(),u=document.getElementById('url').value.trim();if(!t&&!u)return alert('Add source text or URL.');let f=[];f.push({kind:'SOURCE',text:'Original captured material will be preserved as evidence.',confidence:'high'});if(/electrical subcontractor|electrical sub|\bEC\b/i.test(t))f.push({kind:'FACT',text:'Lighting appears to route through an electrical subcontractor in this account context.',confidence:'source-backed'});if(/design team|designer|specif/i.test(t))f.push({kind:'FACT',text:'Design/specification responsibility appears to sit with the design team in this account context.',confidence:'source-backed'});if(/Bernard/i.test(t)&&/Brian/i.test(t))f.push({kind:'FACT',text:'Contact name conflict detected. Verify Brian vs. Bernard against the email/signature evidence.',confidence:'review'});f.push({kind:'INFERENCE',text:'A related GC/EC procurement pattern may be worth comparing with other accounts. Do not treat it as universal.',confidence:'hypothesis'});f.push({kind:'UNKNOWN',text:'Centralized lighting procurement authority is not established by this capture alone.',confidence:'unknown'});pending={a,c,t,u,f};document.getElementById('review').style.display='block';document.getElementById('reviewBody').innerHTML=`<div class="item"><b>${esc(a?.name||'Unlinked account')}</b> ${c?'<span class="pill">'+esc(c.name)+'</span>':''}<div class="muted">Evidence captured for review</div></div>`+f.map(x=>`<div class="fact ${x.kind==='INFERENCE'?'infer':x.kind==='UNKNOWN'?'unknown':''}"><b>${x.kind}</b> — ${esc(x.text)}<div class="muted">${x.confidence}</div></div>`).join('')}function commit(evidenceOnly=false){if(!pending)return;const n=new Date().toISOString(),p=pending;db.evidence.unshift({id:id(),accountId:p.a?.id||null,contactId:p.c?.id||null,text:p.t,url:p.u,facts:p.f,createdAt:n});if(!evidenceOnly)db.activities.unshift({id:id(),accountId:p.a?.id||null,contactId:p.c?.id||null,type:'Intelligence captured',summary:p.f.filter(x=>x.kind==='FACT').map(x=>x.text).join(' ')||'Source captured and reviewed.',createdAt:n});save();clearReview();clearForm()}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function clearReview(){pending=null;document.getElementById('review').style.display='none'}function clearForm(){['account','contact','url','text'].forEach(x=>document.getElementById(x).value='');document.getElementById('file').value=''}function stageFile(i){if(i.files[0])document.getElementById('text').value='Attached file: '+i.files[0].name+'\n\nFile staged as evidence. AI extraction will be added to the connected ingestion layer.'}function render(){document.getElementById('memory').innerHTML=db.evidence.slice(0,20).map(e=>`<div class="item"><b>${esc(db.accounts.find(a=>a.id===e.accountId)?.name||'Unlinked')}</b><div class="muted">${new Date(e.createdAt).toLocaleString()}</div>${esc(e.text||e.url)}</div>`).join('')||'<div class="muted">No captured intelligence yet.</div>'}render()</script></body></html>
