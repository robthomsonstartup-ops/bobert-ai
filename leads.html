<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My List — Bobert</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bobert" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0A0A0A;
      --red:   #DC2626;
      --white: #FFFFFF;
      --gray:  #6B7280;
      --card:  #1A1A1A;
      --card2: #222222;
      --border: rgba(255,255,255,0.1);
      --nav-h: calc(64px + env(safe-area-inset-bottom));
    }
    body {
      font-family: -apple-system, 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: var(--nav-h);
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      padding-top: calc(14px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--black); z-index: 10;
    }
    .logo-wordmark { height: 22px; width: auto; }
    header h1 { font-size: 16px; font-weight: 700; }
    .beta-pill {
      font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
      background: rgba(220,38,38,0.15); color: var(--red);
      padding: 3px 8px; border-radius: 99px;
    }

    main { padding: 16px 20px; max-width: 480px; margin: 0 auto; }
    .count { font-size: 12px; color: var(--gray); margin-bottom: 16px; }

    /* ── Empty state ── */
    .empty {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 80px 20px;
    }
    .empty .icon { font-size: 48px; margin-bottom: 16px; }
    .empty h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .empty p { color: var(--gray); font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    .empty a {
      padding: 13px 24px; background: var(--red); color: var(--white);
      text-decoration: none; border-radius: 12px; font-weight: 700; font-size: 15px;
    }

    /* ── Lead cards ── */
    .lead-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; margin-bottom: 12px; overflow: hidden;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .lead-card:active { opacity: 0.82; }
    .lead-card.has-followup { border-color: rgba(220,38,38,0.35); }

    .card-top { display: flex; gap: 0; pointer-events: none; }
    .card-photo {
      width: 96px; min-height: 96px; flex-shrink: 0;
      object-fit: cover; background: #111;
    }
    .card-photo-placeholder {
      width: 96px; min-height: 96px; flex-shrink: 0;
      background: #111; display: flex; align-items: center;
      justify-content: center; font-size: 26px; color: var(--gray);
    }
    .card-body { padding: 11px 14px; flex: 1; min-width: 0; }
    .card-date { font-size: 10px; color: var(--gray); margin-bottom: 4px; }
    .card-title { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
    .card-title.untitled { color: var(--gray); font-style: italic; font-weight: 400; }
    .card-sub {
      font-size: 12px; color: var(--gray); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-location {
      font-size: 11px; color: var(--gray); margin-top: 5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .card-footer {
      padding: 9px 14px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .followup-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 700;
    }
    .followup-badge.upcoming { background: rgba(220,38,38,0.12); color: #f87171; }
    .followup-badge.future   { background: rgba(255,255,255,0.06); color: var(--gray); }
    .followup-badge.today    { background: var(--red); color: var(--white); }
    .intel-pill {
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      background: rgba(220,38,38,0.12); color: #f87171; border-radius: 99px;
    }
    .spacer { flex: 1; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: var(--gray); font-size: 15px; padding: 4px 5px;
      border-radius: 6px; line-height: 1;
    }
    .delete-btn:active { color: #f87171; }

    /* ── Detail Drawer ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }

    .drawer {
      position: fixed; left: 0; right: 0; bottom: 0;
      max-height: 92vh; background: #111;
      border-radius: 20px 20px 0 0;
      z-index: 101; overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .drawer.open { transform: translateY(0); }

    .drawer-handle {
      width: 36px; height: 4px; background: rgba(255,255,255,0.18);
      border-radius: 2px; margin: 12px auto 0;
    }
    .drawer-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 16px 20px 0;
    }
    .drawer-title { font-size: 18px; font-weight: 800; line-height: 1.3; flex: 1; }
    .drawer-close {
      background: rgba(255,255,255,0.1); border: none; cursor: pointer;
      color: var(--white); font-size: 15px; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-left: 12px;
    }
    .drawer-meta {
      padding: 4px 20px 14px; font-size: 12px; color: var(--gray);
      border-bottom: 1px solid var(--border);
    }
    .drawer-photo { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .drawer-body { padding: 0 20px; }

    .intel-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .intel-section:last-child { border-bottom: none; }
    .intel-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--gray); text-transform: uppercase; margin-bottom: 6px;
    }
    .intel-value { font-size: 14px; line-height: 1.6; }
    .intel-value.highlight { color: #f87171; font-weight: 600; }

    .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .fact-box { background: var(--card2); border-radius: 10px; padding: 10px 12px; }
    .fact-label { font-size: 10px; color: var(--gray); margin-bottom: 3px; }
    .fact-value { font-size: 13px; font-weight: 600; }

    .outreach-card { background: var(--card2); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .outreach-label { font-size: 11px; font-weight: 700; color: #f87171; margin-bottom: 4px; }
    .outreach-text { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.85); }

    .contact-card { background: var(--card2); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .contact-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .contact-meta { font-size: 12px; color: var(--gray); margin-bottom: 8px; }
    .contact-links { display: flex; gap: 7px; flex-wrap: wrap; }
    .contact-link {
      font-size: 12px; padding: 5px 10px; border-radius: 7px;
      background: rgba(255,255,255,0.08); color: var(--white);
      text-decoration: none;
    }
    .contact-link:active { opacity: 0.7; }

    .missing-box {
      background: rgba(220,38,38,0.07); border: 1px solid rgba(220,38,38,0.18);
      border-radius: 10px; padding: 12px;
      font-size: 13px; color: rgba(255,255,255,0.65); line-height: 1.5;
    }

    .drawer-actions { display: flex; gap: 10px; padding: 16px 20px 0; }
    .btn-delete {
      flex: 1; padding: 13px; background: rgba(220,38,38,0.12);
      color: #f87171; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-capture {
      flex: 1; padding: 13px; background: var(--red);
      color: var(--white); border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
      display: flex; align-items: center; justify-content: center;
    }
    .no-intel-note {
      padding: 16px; background: var(--card2); border-radius: 10px;
      font-size: 13px; color: var(--gray); line-height: 1.5; text-align: center;
    }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; align-items: flex-start; justify-content: space-around;
      padding-top: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; flex: 1;
      color: var(--gray); font-size: 10px; font-weight: 600;
      letter-spacing: 0.03em; padding: 0 8px; transition: color 0.15s;
    }
    .nav-item.active { color: var(--white); }
    .nav-item svg { width: 24px; height: 24px; }
    .nav-item.capture-tab { position: relative; top: -10px; }
    .capture-circle {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--red); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(220,38,38,0.45);
    }
    .capture-circle svg { width: 26px; height: 26px; color: var(--white); }
    .nav-item.capture-tab span { color: var(--red); font-weight: 700; }
  </style>
</head>
<body>

<header>
  <img class="logo-wordmark" src="/assets/bobert-wordmark-white.png" alt="Bobert" />
  <h1>My List</h1>
  <span class="beta-pill">BETA</span>
</header>

<main id="main">
  <div class="empty" id="emptyState" style="display:none;">
    <div class="icon">🎯</div>
    <h2>No opportunities yet.</h2>
    <p>Every deal starts with a capture.<br>Spot a job site? Tap Capture.</p>
    <a href="/capture">Capture an Opportunity</a>
  </div>
  <p class="count" id="countLine" style="display:none;"></p>
  <div id="leadsList"></div>
</main>

<!-- Detail Drawer -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div id="drawerContent"></div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a class="nav-item active" href="/leads">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
    </svg>
    <span>My List</span>
  </a>
  <a class="nav-item capture-tab" href="/capture">
    <div class="capture-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </div>
    <span>Capture</span>
  </a>
  <a class="nav-item" href="/account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    <span>Account</span>
  </a>
</nav>

<script>
const DB_NAME = 'bobert-db', STORE = 'opportunities';
let allOpps = [];

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      if (!e.target.result.objectStoreNames.contains(STORE))
        e.target.result.createObjectStore(STORE, { keyPath: 'id' });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}
async function getAll() {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
async function deleteOpp(id) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = res;
    tx.onerror = e => rej(e.target.error);
  });
}

function formatDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit'
  });
}

function followupBadge(dateStr) {
  if (!dateStr) return '';
  const today    = new Date(); today.setHours(0,0,0,0);
  const followUp = new Date(dateStr + 'T00:00:00');
  const diff     = Math.ceil((followUp - today) / 86400000);
  let cls = 'future', label;
  if (diff < 0)       { cls = 'upcoming'; label = `${Math.abs(diff)}d overdue`; }
  else if (diff === 0){ cls = 'today';    label = 'Follow up today'; }
  else if (diff <= 7) { cls = 'upcoming'; label = `Follow up in ${diff}d`; }
  else { label = `Follow up ${new Date(dateStr+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`; }
  return `<span class="followup-badge ${cls}">● ${label}</span>`;
}

function esc(str) { return (str||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function val(v)   { return v && v !== 'null' && v !== 'Unknown' ? v : null; }

// ── List cards ──

function renderCard(opp) {
  const card = document.createElement('div');
  card.className = 'lead-card' + (opp.followUpDate ? ' has-followup' : '');
  card.dataset.id = opp.id;

  const photoHTML = opp.photo
    ? `<img class="card-photo" src="${opp.photo}" alt="Photo" loading="lazy" />`
    : `<div class="card-photo-placeholder">📍</div>`;

  const title = opp.intel?.projectName || null;
  const titleHTML = title
    ? `<div class="card-title">${esc(title.slice(0,55))}</div>`
    : `<div class="card-title untitled">Untitled capture</div>`;

  const sub = opp.intel?.lightingOpportunity || opp.note || null;
  const subHTML = sub
    ? `<div class="card-sub">${esc(sub.slice(0,120))}</div>`
    : '';

  const loc = opp.location?.label || opp.location?.address || null;
  const locHTML = loc
    ? `<div class="card-location">📍 ${esc(loc.slice(0,60))}</div>`
    : '';

  const intelPill = opp.intel ? `<span class="intel-pill">⚡ Intel</span>` : '';

  card.innerHTML = `
    <div class="card-top">
      ${photoHTML}
      <div class="card-body">
        <div class="card-date">${formatDate(opp.createdAt)}</div>
        ${titleHTML}
        ${subHTML}
        ${locHTML}
      </div>
    </div>
    <div class="card-footer">
      ${followupBadge(opp.followUpDate)}
      ${intelPill}
      <div class="spacer"></div>
      <button class="delete-btn" title="Delete">🗑</button>
    </div>
  `;

  card.querySelector('.delete-btn').addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm('Delete this opportunity?')) return;
    await deleteOpp(opp.id);
    card.remove();
    allOpps = allOpps.filter(o => o.id !== opp.id);
    updateCount();
  });

  card.addEventListener('click', () => openDrawer(opp.id));
  return card;
}

function updateCount() {
  const n = document.querySelectorAll('.lead-card').length;
  if (n === 0) showEmpty();
  else document.getElementById('countLine').textContent = `${n} opportunit${n===1?'y':'ies'}`;
}

// ── Drawer ──

function openDrawer(id) {
  const opp = allOpps.find(o => o.id === id);
  if (!opp) return;
  document.getElementById('drawerContent').innerHTML = buildDrawerHTML(opp);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.getElementById('drawerDeleteBtn').addEventListener('click', async () => {
    if (!confirm('Delete this opportunity?')) return;
    await deleteOpp(id);
    allOpps = allOpps.filter(o => o.id !== id);
    document.querySelector(`.lead-card[data-id="${id}"]`)?.remove();
    updateCount();
    closeDrawer();
  });
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

function buildDrawerHTML(opp) {
  const i = opp.intel || {};
  const contacts = opp.contacts || [];
  const hasIntel = !!opp.intel;

  const title = i.projectName || opp.note || 'Untitled Capture';
  const location = i.location || opp.location?.label || opp.location?.address || '';
  const meta = [formatDate(opp.createdAt), location].filter(Boolean).join(' · ');

  const photoHTML = opp.photo ? `<img class="drawer-photo" src="${opp.photo}" alt="Site photo" />` : '';

  const facts = [
    { label: 'Sq Footage', value: val(i.squareFootage) },
    { label: 'Timeline',   value: val(i.deliveryTimeline) },
    { label: 'Developer',  value: val(i.developer?.name) },
    { label: 'GC',         value: val(i.gc?.name) },
  ].filter(f => f.value);

  const factsHTML = facts.length ? `
    <div class="intel-section">
      <div class="intel-label">Project Facts</div>
      <div class="facts-grid">
        ${facts.map(f=>`<div class="fact-box"><div class="fact-label">${f.label}</div><div class="fact-value">${esc(f.value)}</div></div>`).join('')}
      </div>
    </div>` : '';

  const scopeHTML = val(i.projectScope) ? `
    <div class="intel-section">
      <div class="intel-label">Overview</div>
      <div class="intel-value">${esc(i.projectScope)}</div>
    </div>` : '';

  const lightingHTML = val(i.lightingOpportunity) ? `
    <div class="intel-section">
      <div class="intel-label">⚡ Lighting Opportunity</div>
      <div class="intel-value highlight">${esc(i.lightingOpportunity)}</div>
    </div>` : '';

  const routingHTML = val(i.routingNote) ? `
    <div class="intel-section">
      <div class="intel-label">Routing Note</div>
      <div class="intel-value">${esc(i.routingNote)}</div>
    </div>` : '';

  const gcHTML = (val(i.gc?.background) || val(i.gc?.routingNote)) ? `
    <div class="intel-section">
      <div class="intel-label">GC: ${esc(i.gc?.name||'General Contractor')}</div>
      ${val(i.gc?.background) ? `<div class="intel-value" style="margin-bottom:5px">${esc(i.gc.background)}</div>` : ''}
      ${val(i.gc?.routingNote) ? `<div class="intel-value" style="color:var(--gray);font-size:13px">${esc(i.gc.routingNote)}</div>` : ''}
    </div>` : '';

  const paths = (i.outreachPaths||[]).filter(p=>p?.approach);
  const outreachHTML = paths.length ? `
    <div class="intel-section">
      <div class="intel-label">Outreach Paths</div>
      ${paths.map(p=>`
        <div class="outreach-card">
          <div class="outreach-label">${esc(p.label||'Path')}</div>
          <div class="outreach-text">${esc(p.approach)}</div>
        </div>`).join('')}
    </div>` : '';

  const people = (i.keyPeople||[]).filter(p=>p?.name);
  const peopleHTML = people.length ? `
    <div class="intel-section">
      <div class="intel-label">Key People</div>
      ${people.map(p=>`
        <div class="outreach-card" style="margin-bottom:6px">
          <div class="outreach-label">${esc(p.name)}${p.title ? ` — ${esc(p.title)}` : ''}</div>
          ${p.company ? `<div class="outreach-text" style="font-size:12px;color:var(--gray);margin-bottom:3px">${esc(p.company)}</div>` : ''}
          ${val(p.angle) ? `<div class="outreach-text">${esc(p.angle)}</div>` : ''}
        </div>`).join('')}
    </div>` : '';

  const contactsHTML = contacts.length ? `
    <div class="intel-section">
      <div class="intel-label">Contacts</div>
      ${contacts.map(c=>`
        <div class="contact-card">
          <div class="contact-name">${esc(c.name)}</div>
          <div class="contact-meta">${esc([c.title,c.company].filter(Boolean).join(' · '))}</div>
          <div class="contact-links">
            ${c.email    ? `<a class="contact-link" href="mailto:${esc(c.email)}">✉ Email</a>` : ''}
            ${c.phone    ? `<a class="contact-link" href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a>` : ''}
            ${c.linkedin ? `<a class="contact-link" href="${esc(c.linkedin)}" target="_blank" rel="noopener">in LinkedIn</a>` : ''}
          </div>
        </div>`).join('')}
    </div>` : '';

  const missingHTML = val(i.missingInfo) ? `
    <div class="intel-section">
      <div class="intel-label">Still Needed</div>
      <div class="missing-box">${esc(i.missingInfo)}</div>
    </div>` : '';

  const noteHTML = opp.note ? `
    <div class="intel-section">
      <div class="intel-label">Your Note</div>
      <div class="intel-value">${esc(opp.note)}</div>
    </div>` : '';

  const noIntelHTML = !hasIntel ? `
    <div class="intel-section">
      <div class="no-intel-note">No intel card — saved without analysis.<br>
      <a href="/capture" style="color:#f87171;text-decoration:none;margin-top:8px;display:inline-block">+ New capture with intel</a></div>
    </div>` : '';

  return `
    <div class="drawer-header">
      <div class="drawer-title">${esc(title)}</div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <div class="drawer-meta">${esc(meta)}</div>
    ${photoHTML}
    <div class="drawer-body">
      ${noIntelHTML}
      ${factsHTML}
      ${scopeHTML}
      ${lightingHTML}
      ${routingHTML}
      ${gcHTML}
      ${outreachHTML}
      ${peopleHTML}
      ${contactsHTML}
      ${missingHTML}
      ${noteHTML}
    </div>
    <div class="drawer-actions">
      <button class="btn-delete" id="drawerDeleteBtn">🗑 Delete</button>
      <a class="btn-capture" href="/capture">+ New Capture</a>
    </div>
  `;
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('countLine').style.display = 'none';
}

async function init() {
  allOpps = await getAll();
  allOpps.sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  if (allOpps.length === 0) { showEmpty(); return; }
  const countLine = document.getElementById('countLine');
  countLine.style.display = 'block';
  countLine.textContent = `${allOpps.length} opportunit${allOpps.length===1?'y':'ies'}`;
  const list = document.getElementById('leadsList');
  allOpps.forEach(opp => list.appendChild(renderCard(opp)));
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
