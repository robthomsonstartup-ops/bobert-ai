<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Capture — Bobert</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bobert" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0A0A0A;
      --red:   #DC2626;
      --white: #FFFFFF;
      --gray:  #6B7280;
      --card:  #1A1A1A;
      --border: rgba(255,255,255,0.1);
    }
    body {
      font-family: -apple-system, 'Inter', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--black); z-index: 10;
    }
    .logo-mark { height: 34px; width: 34px; border-radius: 7px; }
    header h1 { font-size: 17px; font-weight: 700; }
    .nav-link { color: var(--gray); font-size: 14px; text-decoration: none; }
    .nav-link:hover { color: var(--white); }
    main { padding: 20px; max-width: 480px; margin: 0 auto; }
    section { margin-bottom: 24px; }
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      color: var(--gray); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 8px;
    }

    /* Photo */
    .photo-area {
      position: relative; border-radius: 12px; overflow: hidden;
      border: 2px dashed var(--border); height: 220px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 0.2s;
    }
    .photo-area:hover { border-color: var(--red); }
    .photo-area input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }
    .photo-preview {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: none;
    }
    .photo-placeholder { text-align: center; pointer-events: none; }
    .photo-placeholder .cam { font-size: 40px; margin-bottom: 10px; }
    .photo-placeholder p { color: var(--gray); font-size: 14px; line-height: 1.5; }
    .photo-placeholder strong { color: var(--red); }

    /* GPS */
    .gps-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .gps-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--gray); flex-shrink: 0;
      transition: background 0.3s;
    }
    .gps-row.locating .gps-dot { background: #F59E0B; animation: blink 1s infinite; }
    .gps-row.located  .gps-dot { background: #22C55E; }
    .gps-row.gps-err  .gps-dot { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .gps-text { font-size: 13px; color: var(--gray); line-height: 1.4; }
    .gps-row.located .gps-text { color: var(--white); }

    /* Textarea */
    textarea {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      font-size: 15px; color: var(--white); font-family: inherit;
      resize: vertical; min-height: 100px; outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--red); }
    textarea::placeholder { color: var(--gray); }

    /* Voice */
    .voice-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .record-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--white); font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .record-btn:hover { border-color: var(--red); }
    .record-btn.recording { background: var(--red); border-color: var(--red); }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
    .record-btn.recording .rec-dot { background: var(--white); animation: blink 0.8s infinite; }
    .voice-hint { font-size: 13px; color: var(--gray); }
    audio { width: 100%; height: 40px; margin-top: 10px; opacity: 0.85; }

    /* Date */
    input[type=date] {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      font-size: 15px; color: var(--white); font-family: inherit;
      outline: none; transition: border-color 0.2s; -webkit-appearance: none;
    }
    input[type=date]:focus { border-color: var(--red); }
    input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.6; }

    /* Save */
    .save-btn {
      width: 100%; padding: 16px; background: var(--red);
      color: var(--white); border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: opacity 0.15s; margin-top: 4px;
    }
    .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .save-btn:not(:disabled):hover { opacity: 0.85; }

    /* Success */
    .success {
      display: none; position: fixed; inset: 0; background: var(--black);
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px; z-index: 50;
    }
    .success.show { display: flex; }
    .success-icon { font-size: 64px; margin-bottom: 24px; }
    .success h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .success p { color: var(--gray); font-size: 15px; margin-bottom: 32px; line-height: 1.6; }
    .btn-stack { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; }
    .btn-red  { display:block; padding:14px; background:var(--red); color:var(--white); text-decoration:none; border-radius:10px; font-weight:700; font-size:15px; }
    .btn-dark { display:block; padding:14px; background:var(--card); color:var(--white); text-decoration:none; border-radius:10px; font-weight:600; font-size:15px; border:1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <img class="logo-mark" src="/assets/icon.png" alt="Bobert" />
  <h1>New Opportunity</h1>
  <a class="nav-link" href="/leads">My List →</a>
</header>

<main>

  <section>
    <span class="field-label">Photo</span>
    <div class="photo-area" id="photoArea">
      <input type="file" accept="image/*" capture="environment" id="photoInput" />
      <img class="photo-preview" id="photoPreview" alt="Preview" />
      <div class="photo-placeholder" id="photoPlaceholder">
        <div class="cam">📷</div>
        <p>Tap to <strong>take photo</strong><br>or choose from library</p>
      </div>
    </div>
  </section>

  <section>
    <span class="field-label">Location</span>
    <div class="gps-row locating" id="gpsRow">
      <div class="gps-dot"></div>
      <span class="gps-text" id="gpsText">Getting your location…</span>
    </div>
  </section>

  <section>
    <span class="field-label">Note</span>
    <textarea id="noteInput" placeholder="What did you see? Who did you talk to? What's the opportunity?" rows="4"></textarea>
  </section>

  <section id="voiceSection">
    <span class="field-label">Voice Note <span style="color:var(--gray);font-weight:400;text-transform:none;font-size:11px;">(optional)</span></span>
    <div class="voice-controls">
      <button class="record-btn" id="recordBtn" type="button">
        <div class="rec-dot"></div>
        Record
      </button>
      <span class="voice-hint" id="voiceHint">Tap to record</span>
    </div>
    <audio id="audioPlayback" controls style="display:none;"></audio>
  </section>

  <section>
    <span class="field-label">Follow-up Date</span>
    <input type="date" id="followUpDate" />
  </section>

  <button class="save-btn" id="saveBtn">Save Opportunity</button>

</main>

<div class="success" id="successScreen">
  <div class="success-icon">✅</div>
  <h2>Saved.</h2>
  <p id="successMsg">Your opportunity is saved.<br>You can find it in My List.</p>
  <div class="btn-stack">
    <a class="btn-red" href="/leads">View My List</a>
    <a class="btn-dark" href="/capture">Capture Another</a>
  </div>
</div>

<script>
// ── IndexedDB ─────────────────────────────────────────────
const DB_NAME = 'bobert-db', STORE = 'opportunities';

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE))
        db.createObjectStore(STORE, { keyPath: 'id' });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}

async function saveOpp(opp) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(opp);
    tx.oncomplete = res;
    tx.onerror = e => rej(e.target.error);
  });
}

// ── GPS ───────────────────────────────────────────────────
let gpsData = null;
const gpsRow  = document.getElementById('gpsRow');
const gpsText = document.getElementById('gpsText');

function setGPSState(state, text) {
  gpsRow.className = 'gps-row ' + state;
  gpsText.textContent = text;
}

function fetchGPS() {
  if (!navigator.geolocation) { setGPSState('gps-err', 'GPS not available on this device'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    gpsData = { lat, lng, accuracy };
    setGPSState('locating', 'Resolving address…');
    try {
      const r  = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`, { headers: { 'Accept-Language': 'en' } });
      const d  = await r.json();
      const label = d.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      gpsData.label = label;
      const short = label.length > 70 ? label.slice(0, 70) + '…' : label;
      setGPSState('located', short);
    } catch {
      gpsData.label = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      setGPSState('located', gpsData.label);
    }
  }, () => {
    setGPSState('gps-err', 'Location unavailable — opportunity will save without it');
  }, { enableHighAccuracy: true, timeout: 12000 });
}

fetchGPS();

// ── Photo ─────────────────────────────────────────────────
let photoBase64 = null;
const photoInput   = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');
const photoPlaceholder = document.getElementById('photoPlaceholder');

photoInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  // Compress via canvas before storing
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const MAX = 1200;
    let w = img.width, h = img.height;
    if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
    if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    photoBase64 = canvas.toDataURL('image/jpeg', 0.75);
    photoPreview.src = photoBase64;
    photoPreview.style.display = 'block';
    photoPlaceholder.style.display = 'none';
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

// ── Voice Note ────────────────────────────────────────────
let mediaRecorder = null, audioChunks = [], audioBlob = null, isRecording = false;
const recordBtn    = document.getElementById('recordBtn');
const voiceHint    = document.getElementById('voiceHint');
const audioPlayback= document.getElementById('audioPlayback');

if (!navigator.mediaDevices || !window.MediaRecorder) {
  document.getElementById('voiceSection').style.display = 'none';
} else {
  recordBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          audioPlayback.src = URL.createObjectURL(audioBlob);
          audioPlayback.style.display = 'block';
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('recording');
        recordBtn.lastChild.textContent = ' Stop';
        voiceHint.textContent = 'Recording…';
      } catch {
        voiceHint.textContent = 'Microphone access denied';
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      recordBtn.lastChild.textContent = ' Re-record';
      voiceHint.textContent = 'Tap to re-record';
    }
  });
}

// ── Save ──────────────────────────────────────────────────
const saveBtn      = document.getElementById('saveBtn');
const successScreen= document.getElementById('successScreen');
const successMsg   = document.getElementById('successMsg');

saveBtn.addEventListener('click', async () => {
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';

  let audioBase64 = null;
  if (audioBlob) {
    audioBase64 = await new Promise(res => {
      const reader = new FileReader();
      reader.onload = e => res(e.target.result);
      reader.readAsDataURL(audioBlob);
    });
  }

  const followUp = document.getElementById('followUpDate').value;
  const note     = document.getElementById('noteInput').value.trim();

  const opp = {
    id:          Date.now().toString(),
    createdAt:   new Date().toISOString(),
    photo:       photoBase64,
    location:    gpsData || null,
    note,
    audio:       audioBase64,
    followUpDate: followUp || null,
  };

  try {
    await saveOpp(opp);

    // Request notification permission for reminder
    if (followUp && 'Notification' in window && Notification.permission !== 'denied') {
      const perm = Notification.permission === 'granted'
        ? 'granted'
        : await Notification.requestPermission();
      if (perm === 'granted') {
        const delay = new Date(followUp + 'T09:00:00').getTime() - Date.now();
        if (delay > 0 && delay < 86400000 * 7) { // Only schedule if within 7 days
          setTimeout(() => {
            new Notification('Bobert — Follow-up today', {
              body: note ? note.slice(0, 100) : 'Time to follow up on your opportunity.',
              icon: '/assets/icon.png',
            });
          }, delay);
        }
      }
    }

    const dateStr = followUp
      ? new Date(followUp + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
      : null;
    successMsg.innerHTML = `Your opportunity is saved.<br>${dateStr ? `Follow-up reminder set for <strong>${dateStr}</strong>.` : 'Find it in My List.'}`;
    successScreen.classList.add('show');
  } catch (err) {
    alert('Save failed — ' + err.message);
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Opportunity';
  }
});

// ── Service Worker ────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
