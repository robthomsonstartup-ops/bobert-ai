<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in — Bobert</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Inter', sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .check {
      width: 64px; height: 64px;
      background: #16a34a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 28px;
    }
    h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
    p { color: #6B7280; font-size: 16px; line-height: 1.6; max-width: 480px; }
    .detail { margin-top: 8px; color: #9CA3AF; font-size: 14px; }
    .home-btn {
      margin-top: 40px;
      display: inline-block;
      padding: 14px 28px;
      background: #DC2626;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      border-radius: 8px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="check">✓</div>
  <h1>Your trial has started.</h1>
  <p>30 days free. No charge until your trial ends.</p>
  <p class="detail">Check your email for a confirmation from Stripe. You can cancel anytime from your billing portal.</p>
  <a class="home-btn" href="/">Back to Bobert</a>
</body>
</html>
